AWSTemplateFormatVersion: '2010-09-09'
Description: CloudWatch monitoring and alerting for prediction-data ingestion tasks

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Environment name (used in resource naming)

  LogGroupName:
    Type: String
    Description: Name of the CloudWatch log group (from ecs-cluster stack, e.g., /ecs/prediction-data-dev)

  ECSClusterName:
    Type: String
    Description: Name of the ECS cluster (e.g., prediction-data-dev)

  AlertEmail:
    Type: String
    Default: ''
    Description: Email address for alert notifications (leave empty to skip email subscription)

  OrderFilledExpectedIntervalSeconds:
    Type: Number
    Default: 600
    Description: Expected interval for order_filled catchup in seconds (default 600 = 10 minutes)

  MarketsExpectedIntervalSeconds:
    Type: Number
    Default: 7200
    Description: Expected interval for markets ingestion in seconds (default 7200 = 2 hours)

  TaskFailureThreshold:
    Type: Number
    Default: 3
    Description: Number of task failures in evaluation period before alarming

  TaskFailureEvaluationPeriods:
    Type: Number
    Default: 1
    Description: Number of evaluation periods for task failure alarm

  SilverTradesMissingRunIntervalSeconds:
    Type: Number
    Default: 3600
    Description: >-
      Period in seconds to check for missing Silver trades runs.
      At 10-min cadence, expect ~6 runs/hour; zero in this window means schedule or ECS is broken.

  SilverProcessingFailureThreshold:
    Type: Number
    Default: 3
    Description: >-
      Number of Silver processing failures in a 30-minute window before alarming.
      Occasional failures are expected (transient S3 errors) but sustained failures need investigation.

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]

Resources:
  # SNS Topic for alert notifications
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'prediction-data-alerts-${Environment}'
      DisplayName: !Sub 'Prediction Data Alerts (${Environment})'
      Tags:
        - Key: Project
          Value: prediction-data
        - Key: Environment
          Value: !Ref Environment

  # Email subscription (conditional)
  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # Metric Filter for ERROR level logs
  ErrorLogMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroupName
      FilterPattern: '?ERROR ?Error ?error ?CRITICAL ?Critical ?critical ?Exception ?exception ?Traceback'
      MetricTransformations:
        - MetricName: ErrorCount
          MetricNamespace: !Sub 'PredictionData/${Environment}'
          MetricValue: '1'
          DefaultValue: 0
          Unit: Count

  # Metric Filter for successful ingestion completion
  SuccessLogMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroupName
      FilterPattern: '"Successfully ingested" OR "Ingestion complete" OR "completed successfully"'
      MetricTransformations:
        - MetricName: SuccessfulIngestions
          MetricNamespace: !Sub 'PredictionData/${Environment}'
          MetricValue: '1'
          DefaultValue: 0
          Unit: Count

  # Metric Filter for Polymarket order_filled runs
  PolymarketOrderFilledMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroupName
      FilterPattern: '"order_filled" "polymarket"'
      MetricTransformations:
        - MetricName: PolymarketOrderFilledRuns
          MetricNamespace: !Sub 'PredictionData/${Environment}'
          MetricValue: '1'
          DefaultValue: 0
          Unit: Count

  # Metric Filter for Kalshi trades runs
  KalshiTradesMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroupName
      FilterPattern: '"kalshi-trades" "ingest"'
      MetricTransformations:
        - MetricName: KalshiTradesRuns
          MetricNamespace: !Sub 'PredictionData/${Environment}'
          MetricValue: '1'
          DefaultValue: 0
          Unit: Count

  # Metric Filter for Polymarket markets runs
  PolymarketMarketsMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroupName
      FilterPattern: '"polymarket-markets" "ingest"'
      MetricTransformations:
        - MetricName: PolymarketMarketsRuns
          MetricNamespace: !Sub 'PredictionData/${Environment}'
          MetricValue: '1'
          DefaultValue: 0
          Unit: Count

  # Metric Filter for Kalshi markets runs
  KalshiMarketsMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroupName
      FilterPattern: '"kalshi-markets" "ingest"'
      MetricTransformations:
        - MetricName: KalshiMarketsRuns
          MetricNamespace: !Sub 'PredictionData/${Environment}'
          MetricValue: '1'
          DefaultValue: 0
          Unit: Count

  # --- Silver Layer Metric Filters ---

  # Metric Filter for Silver processing success (catchup or process completes all manifests)
  SilverProcessingSuccessMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroupName
      FilterPattern: '"All manifests processed successfully"'
      MetricTransformations:
        - MetricName: SilverProcessingSuccess
          MetricNamespace: !Sub 'PredictionData/${Environment}'
          MetricValue: '1'
          DefaultValue: 0
          Unit: Count

  # Metric Filter for Silver no-op exits (no new data to process — expected majority of runs)
  SilverNoOpMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroupName
      FilterPattern: '"silver_catchup_noop"'
      MetricTransformations:
        - MetricName: SilverNoOp
          MetricNamespace: !Sub 'PredictionData/${Environment}'
          MetricValue: '1'
          DefaultValue: 0
          Unit: Count

  # Metric Filter for Silver concurrency skips (guard prevents overlapping runs)
  SilverConcurrencySkipMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroupName
      FilterPattern: '"Concurrent task detected" "silver-"'
      MetricTransformations:
        - MetricName: SilverConcurrencySkip
          MetricNamespace: !Sub 'PredictionData/${Environment}'
          MetricValue: '1'
          DefaultValue: 0
          Unit: Count

  # Metric Filter for Silver processing failures (per-manifest FAILED: output)
  SilverProcessingFailureMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroupName
      FilterPattern: '"FAILED:"'
      MetricTransformations:
        - MetricName: SilverProcessingFailure
          MetricNamespace: !Sub 'PredictionData/${Environment}'
          MetricValue: '1'
          DefaultValue: 0
          Unit: Count

  # --- Bronze Layer Alarms ---

  # Alarm for error log patterns
  ErrorLogAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'prediction-data-errors-${Environment}'
      AlarmDescription: Alerts when error patterns are detected in ingestion logs
      MetricName: ErrorCount
      Namespace: !Sub 'PredictionData/${Environment}'
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic
      Tags:
        - Key: Project
          Value: prediction-data
        - Key: Environment
          Value: !Ref Environment

  # Alarm for ECS task failures (uses Container Insights metrics)
  TaskFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'prediction-data-task-failures-${Environment}'
      AlarmDescription: Alerts when ECS tasks fail to complete successfully
      MetricName: TaskCount
      Namespace: ECS/ContainerInsights
      Dimensions:
        - Name: ClusterName
          Value: !Ref ECSClusterName
        - Name: TaskDefinitionFamily
          Value: !Sub 'prediction-data-ingest-${Environment}'
      ExtendedStatistic: p0
      Period: 300
      EvaluationPeriods: !Ref TaskFailureEvaluationPeriods
      Threshold: !Ref TaskFailureThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic
      Tags:
        - Key: Project
          Value: prediction-data
        - Key: Environment
          Value: !Ref Environment

  # Alarm for missing Polymarket order_filled runs
  MissingPolymarketOrderFilledAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'prediction-data-missing-polymarket-order-filled-${Environment}'
      AlarmDescription: Alerts when no Polymarket order_filled catchup runs in the expected interval
      MetricName: PolymarketOrderFilledRuns
      Namespace: !Sub 'PredictionData/${Environment}'
      Statistic: Sum
      Period: !Ref OrderFilledExpectedIntervalSeconds
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic
      Tags:
        - Key: Project
          Value: prediction-data
        - Key: Environment
          Value: !Ref Environment

  # Alarm for missing Kalshi trades runs
  MissingKalshiTradesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'prediction-data-missing-kalshi-trades-${Environment}'
      AlarmDescription: Alerts when no Kalshi trades ingestion runs in the expected interval
      MetricName: KalshiTradesRuns
      Namespace: !Sub 'PredictionData/${Environment}'
      Statistic: Sum
      Period: !Ref OrderFilledExpectedIntervalSeconds
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic
      Tags:
        - Key: Project
          Value: prediction-data
        - Key: Environment
          Value: !Ref Environment

  # Alarm for missing Polymarket markets runs
  MissingPolymarketMarketsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'prediction-data-missing-polymarket-markets-${Environment}'
      AlarmDescription: Alerts when no Polymarket markets ingestion runs in the expected interval
      MetricName: PolymarketMarketsRuns
      Namespace: !Sub 'PredictionData/${Environment}'
      Statistic: Sum
      Period: !Ref MarketsExpectedIntervalSeconds
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic
      Tags:
        - Key: Project
          Value: prediction-data
        - Key: Environment
          Value: !Ref Environment

  # Alarm for missing Kalshi markets runs
  MissingKalshiMarketsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'prediction-data-missing-kalshi-markets-${Environment}'
      AlarmDescription: Alerts when no Kalshi markets ingestion runs in the expected interval
      MetricName: KalshiMarketsRuns
      Namespace: !Sub 'PredictionData/${Environment}'
      Statistic: Sum
      Period: !Ref MarketsExpectedIntervalSeconds
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic
      Tags:
        - Key: Project
          Value: prediction-data
        - Key: Environment
          Value: !Ref Environment

  # --- Silver Layer Alarms ---

  # Alarm for missing Silver trades runs — zero activity in 1 hour means schedule or ECS is broken
  SilverTradesMissingRunsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'prediction-data-silver-trades-missing-runs-${Environment}'
      AlarmDescription: >-
        Alerts when zero Silver trades runs (success + noop) occur in the expected interval.
        At 10-min cadence, expect ~6 runs/hour; zero means the EventBridge schedule or ECS is broken.
      Metrics:
        - Id: success
          MetricStat:
            Metric:
              Namespace: !Sub 'PredictionData/${Environment}'
              MetricName: SilverProcessingSuccess
            Period: !Ref SilverTradesMissingRunIntervalSeconds
            Stat: Sum
          ReturnData: false
        - Id: noop
          MetricStat:
            Metric:
              Namespace: !Sub 'PredictionData/${Environment}'
              MetricName: SilverNoOp
            Period: !Ref SilverTradesMissingRunIntervalSeconds
            Stat: Sum
          ReturnData: false
        - Id: total_runs
          Expression: 'success + noop'
          Label: 'Total Silver Runs (success + noop)'
          ReturnData: true
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic
      Tags:
        - Key: Project
          Value: prediction-data
        - Key: Environment
          Value: !Ref Environment

  # Alarm for Silver processing errors — sustained failures need investigation
  SilverProcessingErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'prediction-data-silver-processing-errors-${Environment}'
      AlarmDescription: >-
        Alerts when Silver processing failures exceed threshold in a 30-minute window.
        Occasional failures are expected (transient S3 errors) but sustained failures need investigation.
      MetricName: SilverProcessingFailure
      Namespace: !Sub 'PredictionData/${Environment}'
      Statistic: Sum
      Period: 1800
      EvaluationPeriods: 1
      Threshold: !Ref SilverProcessingFailureThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic
      Tags:
        - Key: Project
          Value: prediction-data
        - Key: Environment
          Value: !Ref Environment

  # CloudWatch Dashboard for monitoring overview
  MonitoringDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub 'prediction-data-${Environment}'
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Ingestion Runs by Type",
                "metrics": [
                  ["PredictionData/${Environment}", "PolymarketOrderFilledRuns", {"label": "Polymarket Order Filled"}],
                  [".", "KalshiTradesRuns", {"label": "Kalshi Trades"}],
                  [".", "PolymarketMarketsRuns", {"label": "Polymarket Markets"}],
                  [".", "KalshiMarketsRuns", {"label": "Kalshi Markets"}]
                ],
                "period": 300,
                "stat": "Sum",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stacked": false
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Errors and Successes",
                "metrics": [
                  ["PredictionData/${Environment}", "ErrorCount", {"label": "Errors", "color": "#d62728"}],
                  [".", "SuccessfulIngestions", {"label": "Successes", "color": "#2ca02c"}]
                ],
                "period": 300,
                "stat": "Sum",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stacked": false
              }
            },
            {
              "type": "alarm",
              "x": 0,
              "y": 6,
              "width": 24,
              "height": 3,
              "properties": {
                "title": "Alarm Status",
                "alarms": [
                  "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:prediction-data-errors-${Environment}",
                  "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:prediction-data-task-failures-${Environment}",
                  "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:prediction-data-missing-polymarket-order-filled-${Environment}",
                  "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:prediction-data-missing-kalshi-trades-${Environment}",
                  "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:prediction-data-missing-polymarket-markets-${Environment}",
                  "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:prediction-data-missing-kalshi-markets-${Environment}",
                  "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:prediction-data-silver-trades-missing-runs-${Environment}",
                  "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:prediction-data-silver-processing-errors-${Environment}"
                ]
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 9,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Silver Runs by Outcome",
                "metrics": [
                  ["PredictionData/${Environment}", "SilverProcessingSuccess", {"label": "Success", "color": "#2ca02c"}],
                  [".", "SilverNoOp", {"label": "No-Op", "color": "#1f77b4"}],
                  [".", "SilverConcurrencySkip", {"label": "Concurrency Skip", "color": "#ff7f0e"}],
                  [".", "SilverProcessingFailure", {"label": "Failure", "color": "#d62728"}]
                ],
                "period": 300,
                "stat": "Sum",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stacked": true
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 9,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Silver Concurrency Skip Rate",
                "metrics": [
                  ["PredictionData/${Environment}", "SilverConcurrencySkip", {"label": "Concurrency Skips", "color": "#ff7f0e"}]
                ],
                "period": 3600,
                "stat": "Sum",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stacked": false
              }
            },
            {
              "type": "log",
              "x": 0,
              "y": 15,
              "width": 24,
              "height": 6,
              "properties": {
                "title": "Recent Logs",
                "query": "SOURCE '${LogGroupName}' | fields @timestamp, @message | sort @timestamp desc | limit 100",
                "region": "${AWS::Region}",
                "view": "table"
              }
            }
          ]
        }

Outputs:
  AlertTopicArn:
    Description: ARN of the SNS alert topic
    Value: !Ref AlertTopic
    Export:
      Name: !Sub '${AWS::StackName}-AlertTopicArn'

  AlertTopicName:
    Description: Name of the SNS alert topic
    Value: !GetAtt AlertTopic.TopicName
    Export:
      Name: !Sub '${AWS::StackName}-AlertTopicName'

  ErrorLogAlarmArn:
    Description: ARN of the error log alarm
    Value: !GetAtt ErrorLogAlarm.Arn
    Export:
      Name: !Sub '${AWS::StackName}-ErrorLogAlarmArn'

  TaskFailureAlarmArn:
    Description: ARN of the task failure alarm
    Value: !GetAtt TaskFailureAlarm.Arn
    Export:
      Name: !Sub '${AWS::StackName}-TaskFailureAlarmArn'

  MissingPolymarketOrderFilledAlarmArn:
    Description: ARN of the missing Polymarket order_filled alarm
    Value: !GetAtt MissingPolymarketOrderFilledAlarm.Arn
    Export:
      Name: !Sub '${AWS::StackName}-MissingPolymarketOrderFilledAlarmArn'

  MissingKalshiTradesAlarmArn:
    Description: ARN of the missing Kalshi trades alarm
    Value: !GetAtt MissingKalshiTradesAlarm.Arn
    Export:
      Name: !Sub '${AWS::StackName}-MissingKalshiTradesAlarmArn'

  MissingPolymarketMarketsAlarmArn:
    Description: ARN of the missing Polymarket markets alarm
    Value: !GetAtt MissingPolymarketMarketsAlarm.Arn
    Export:
      Name: !Sub '${AWS::StackName}-MissingPolymarketMarketsAlarmArn'

  MissingKalshiMarketsAlarmArn:
    Description: ARN of the missing Kalshi markets alarm
    Value: !GetAtt MissingKalshiMarketsAlarm.Arn
    Export:
      Name: !Sub '${AWS::StackName}-MissingKalshiMarketsAlarmArn'

  SilverTradesMissingRunsAlarmArn:
    Description: ARN of the Silver trades missing runs alarm
    Value: !GetAtt SilverTradesMissingRunsAlarm.Arn
    Export:
      Name: !Sub '${AWS::StackName}-SilverTradesMissingRunsAlarmArn'

  SilverProcessingErrorsAlarmArn:
    Description: ARN of the Silver processing errors alarm
    Value: !GetAtt SilverProcessingErrorsAlarm.Arn
    Export:
      Name: !Sub '${AWS::StackName}-SilverProcessingErrorsAlarmArn'

  DashboardName:
    Description: Name of the CloudWatch dashboard
    Value: !Sub 'prediction-data-${Environment}'
    Export:
      Name: !Sub '${AWS::StackName}-DashboardName'

  DeploymentCommand:
    Description: Example AWS CLI command to deploy this stack
    Value: !Sub |
      aws cloudformation deploy \
        --template-file infrastructure/cloudwatch-monitoring.yaml \
        --stack-name prediction-data-monitoring \
        --parameter-overrides \
          Environment=dev \
          LogGroupName=/ecs/prediction-data-dev \
          ECSClusterName=prediction-data-dev \
          AlertEmail=your-email@example.com
